# Notes:
# - Docker containers with R, etc. provided by rocker.  See <https://hub.docker.com/r/rocker/verse>.
# - Builds attempted for 4.0.5, and the *latest* R edition supported by rocker.

version: 2.1

workflows:

  version: 2
  Prepare-All-R-Editions:
    jobs:
      - Build-for-r4_2_0
      - Build-for-rLATEST

jobs:

  Build-for-r4_2_0:
    docker:
      - image: rocker/verse:4.2

    steps:
      - checkout
      - run:
          name: Review checkout
          command: ls -la

      - run:
          name: Install Linux dependencies
          command: |
            sudo apt-get update -y
            sudo apt-get install -yq texlive-fonts-recommended
            sudo apt-get install -yq texlive-fonts-extra

      - run:
          name: Install R dependencies
          command: |
            R -e 'install.packages(c("shinyWidgets", "yaml", "DT", "writexl", "fresh", "miniUI", "shinyFeedback"))'
            R -e 'install.packages(c("canvasXpress", "waiter", "shinyjs", "openxlsx",  "openxlsx2", "spelling", "colourpicker", "lifecycle"))'
            R -e 'install.packages("covr")'
            R -e 'install.packages("reactable")'
            R -e 'install.packages("bs4Dash", repos = "https://cran.rstudio.com/")'

      - run:
          name: Session information and installed package versions
          command: |
            Rscript -e 'sessionInfo()'
            Rscript -e 'installed.packages()[, c("Package", "Version")]'
            Rscript -e 'rmarkdown::pandoc_version()'

      - run:
          name: Build package
          command: R CMD build .

      - run:
          name: Check package
          environment:
            # Print ALL lines of failing test output instead of last 13
            _R_CHECK_TESTS_NLINES_: "0"
            # Don't stop testthat at the first few failures
            TESTTHAT_MAX_FAILS: "999"
            # Make check output more informative
            _R_CHECK_FORCE_SUGGESTS_: "true"
          command: |
            # Install suggested packages
            R -e 'install.packages("png")'
            # Perform package check
            R CMD check *tar.gz

      - run:
          name: Dump full test logs on failure
          when: on_fail
          command: |
            echo "============================================"
            echo "===== testthat.Rout.fail (FAILED TESTS) ====="
            echo "============================================"
            cat *.Rcheck/tests/testthat.Rout.fail 2>/dev/null || echo "(no testthat.Rout.fail found)"
            echo ""
            echo "============================================"
            echo "===== testthat.Rout (FULL TEST OUTPUT) ====="
            echo "============================================"
            cat *.Rcheck/tests/testthat.Rout 2>/dev/null || echo "(no testthat.Rout found)"
            echo ""
            echo "============================================"
            echo "===== spelling.Rout ========================"
            echo "============================================"
            cat *.Rcheck/tests/spelling.Rout 2>/dev/null || echo "(no spelling.Rout found)"
            echo ""
            echo "============================================"
            echo "===== 00check.log =========================="
            echo "============================================"
            cat *.Rcheck/00check.log 2>/dev/null || echo "(no 00check.log found)"
            echo ""
            echo "============================================"
            echo "===== 00install.out ========================"
            echo "============================================"
            cat *.Rcheck/00install.out 2>/dev/null || echo "(no 00install.out found)"
            echo ""
            echo "===== Package versions in check library ====="
            R -e 'ip <- installed.packages()[, c("Package","Version")]; print(ip[ip[,"Package"] %in% c("ggplot2","shiny","bs4Dash","cli","rlang","testthat","vctrs","scales"), ], row.names = FALSE)'

      - run:
          name: Archive Rcheck directory
          when: always
          command: |
            tar czf rcheck-logs.tar.gz *.Rcheck 2>/dev/null || true

      - store_artifacts:
          path: rcheck-logs.tar.gz
          destination: rcheck-logs.tar.gz

      - store_artifacts:
          path: .
          destination: workspace


  Build-for-rLATEST:
    docker:
      - image: rocker/verse:latest

    steps:
      - checkout
      - run:
          name: Review checkout
          command: ls -la

      - run:
          name: Install Linux dependencies
          command: |
            sudo apt-get update -y
            sudo apt-get install -yq texlive-fonts-recommended
            sudo apt-get install -yq texlive-fonts-extra

      - run:
          name: Install R dependencies
          command: |
            R -e 'install.packages(c("bs4Dash", "shinyWidgets", "yaml", "DT", "writexl", "fresh", "miniUI", "shinyFeedback"))'
            R -e 'install.packages(c("canvasXpress", "waiter", "shinyjs", "openxlsx",  "openxlsx2", "spelling", "colourpicker", "lifecycle"))'
            R -e 'install.packages("covr")'
            R -e 'install.packages("reactable")'

      - run:
          name: Session information and installed package versions
          command: |
            Rscript -e 'sessionInfo()'
            Rscript -e 'installed.packages()[, c("Package", "Version")]'
            Rscript -e 'rmarkdown::pandoc_version()'

      - run:
          name: Build package
          command: R CMD build .

      - run:
          name: Check coverage
          command: Rscript -e 'library(covr); codecov(quiet = FALSE)'

      - run:
          name: Check package
          command: |
            # Install suggested packages
            R -e 'install.packages("png")'
            # Perform package check
            R CMD check *tar.gz

