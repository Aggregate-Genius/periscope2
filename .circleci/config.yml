# Notes:
# - Docker containers with R, etc. provided by rocker.  See <https://hub.docker.com/r/rocker/verse>.
# - Builds attempted for 4.0.5, and the *latest* R edition supported by rocker.

version: 2.1

workflows:

  version: 2
  Prepare-All-R-Editions:
    jobs:
      - Build-for-r4_0_5
      - Build-for-rLATEST

jobs:

  Build-for-r4_0_5:
    docker:
      - image: rocker/verse:4.0.5

    steps:
      - checkout
      - run:
          name: Review checkout
          command: ls -la

      - run:
          name: Install Linux dependencies
          command: |
            sudo apt-get update -y
            sudo apt-get install -yq texlive-fonts-recommended
            sudo apt-get install -yq texlive-fonts-extra

      - run:
          name: Install R dependencies
          command: |
            R -e '.libPaths()'
            R -e 'if (system.file(package="shiny") != "") print(packageVersion("shiny")) else print("Shiny is completely missing")'

            # Use a LATER snapshot (early 2023) so openxlsx2 and newer bs4Dash exist.
            # 2023-04-01 is after openxlsx2's CRAN debut but still generally friendly to R 4.0.5.
            export CRAN_REPO="https://packagemanager.posit.co/cran/2023-04-01"
            echo "options(repos = c(CRAN = '${CRAN_REPO}'))" >> ~/.Rprofile
            echo "options(HTTPUserAgent = sprintf('R/%s R (%s)', getRversion(), paste(getRversion(), R.version\$platform, R.version\$arch, R.version\$os)))" >> ~/.Rprofile
            R -e 'getOption("repos")'

            # --- Pin the problem packages that dropped R 4.0.5 support ---
            # Install remotes first (needed for install_version)
            R -e 'install.packages("remotes")'

            # Pin versions known to still support R >= 4.0
            R -e 'remotes::install_version("promises",  version = "1.2.1",   upgrade = "never")'
            R -e 'remotes::install_version("httr2",     version = "0.2.3",   upgrade = "never")'
            R -e 'remotes::install_version("testthat",  version = "3.1.10",  upgrade = "never")'
            R -e 'remotes::install_version("shiny",     version = "1.7.5",   upgrade = "never")'

            R -e 'print(packageVersion("shiny"))'

            # --- The rest come from the 2023-04-01 snapshot ---
            R -e 'options(warn = 2); install.packages("bs4Dash", dependencies = TRUE)'
            R -e 'install.packages(c("shinyWidgets", "yaml", "DT", "writexl", "fresh", "miniUI", "shinyFeedback"))'
            R -e 'install.packages(c("canvasXpress", "waiter", "shinyjs", "openxlsx", "spelling", "colourpicker", "lifecycle"))'
            R -e 'install.packages("reactable")'
            R -e 'install.packages("openxlsx2")'

            # Sanity check versions periscope2 cares about
            R -e 'print(packageVersion("bs4Dash")); print(packageVersion("openxlsx2")); print(packageVersion("shiny"))'

      - run:
          name: Session information and installed package versions
          command: |
            Rscript -e 'sessionInfo()'
            Rscript -e 'installed.packages()[, c("Package", "Version")]'
            Rscript -e 'rmarkdown::pandoc_version()'

      - run:
          name: Build package
          command: R CMD build .

      - run:
          name: Check package
          command: |
            # Install suggested packages
            R -e 'install.packages("png")'
            # Perform package check
            R CMD check *tar.gz


  Build-for-rLATEST:
    docker:
      - image: rocker/verse:latest

    steps:
      - checkout
      - run:
          name: Review checkout
          command: ls -la

      - run:
          name: Install Linux dependencies
          command: |
            sudo apt-get update -y
            sudo apt-get install -yq texlive-fonts-recommended
            sudo apt-get install -yq texlive-fonts-extra

      - run:
          name: Install R dependencies
          command: |
            R -e 'install.packages(c("bs4Dash", "shinyWidgets", "yaml", "DT", "writexl", "fresh", "miniUI", "shinyFeedback"))'
            R -e 'install.packages(c("canvasXpress", "waiter", "shinyjs", "openxlsx",  "openxlsx2", "spelling", "colourpicker", "lifecycle"))'
            R -e 'install.packages("covr")'
            R -e 'install.packages("reactable")'

      - run:
          name: Session information and installed package versions
          command: |
            Rscript -e 'sessionInfo()'
            Rscript -e 'installed.packages()[, c("Package", "Version")]'
            Rscript -e 'rmarkdown::pandoc_version()'

      - run:
          name: Build package
          command: R CMD build .

      - run:
          name: Check coverage
          command: Rscript -e 'library(covr); codecov(quiet = FALSE)'

      - run:
          name: Check package
          command: |
            # Install suggested packages
            R -e 'install.packages("png")'
            # Perform package check
            R CMD check *tar.gz

